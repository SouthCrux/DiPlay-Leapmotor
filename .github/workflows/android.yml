name: Android checks
on:
  push:
    branches: [main, leapmotor/c11-integration, 'leapmotor/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Test LeapMoto planning and API contracts offline
        run: python3 -m unittest discover -s tools/ev_assistant -p 'test_*.py'
      - name: Test filtered vehicle diagnostics offline
        run: |
          python3 -m unittest discover -s tools/carplay -p 'test_capture_events.py'
          python3 -m unittest discover -s tools/carplay -p 'test_tpms_evidence.py'
          python3 -m unittest discover -s tools/carplay -p 'test_module_evidence.py'
          python3 -m unittest discover -s tools/carplay -p 'test_camera_frame.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug :c11diagnostics:testDebugUnitTest :c11diagnostics:lintDebug :c11diagnostics:assembleDebug --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
            tools/c11diagnostics/build/reports/
